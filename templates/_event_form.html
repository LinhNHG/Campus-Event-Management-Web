<div class="field"><label for="name">Event name</label><input id="name" name="name" value="{{ event['name'] if event else '' }}" placeholder="e.g. Python Workshop" maxlength="180" required></div><div class="form-grid"><div class="field"><label for="date">Event date</label><input id="date" name="date" type="date" value="{{ event['date'] if event else '' }}" required></div><div class="field"><label for="capacity">Capacity</label><input id="capacity" name="capacity" type="number" min="1" step="1" value="{{ event['capacity'] if event else '' }}" placeholder="50" required><small>Total number of available places.</small></div></div><div class="field"><label for="location">Location</label><input id="location" name="location" value="{{ event['location'] if event else '' }}" placeholder="e.g. Hall A, Campus Building" required></div>
